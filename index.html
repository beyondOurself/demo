<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>徐泽睿精美动态Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: '华文行楷', '楷体', serif;
            padding: 10px;
            overflow: hidden;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .logo-container {
            position: relative;
            width: 90vw;
            height: 90vw;
            max-width: 320px;
            max-height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .spinning-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #ff6b6b, #ffa500, #ffd700, #98ff98, 
                #40e0d0, #66b3ff, #da70d6, #ff6b6b
            );
            animation: spin 25s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .inner-disc {
            position: absolute;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            border-radius: 50%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0, 0.3);
        }
        
        .character {
            position: absolute;
            font-size: 16vw;
            max-font-size: 40px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
            animation: floatChar 6s ease-in-out infinite;
        }
        
        .char-xu {
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #e74c3c;
        }
        
        .char-ze {
            top: 50%;
            right: 10%;
            transform: translateY(-50%) rotate(90deg);
            color: #3498db;
        }
        
        .char-rui {
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%) rotate(180deg);
            color: #2ecc71;
        }
        
        @keyframes floatChar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .center-name {
            position: absolute;
            font-size: 6vw;
            max-font-size: 18px;
            color: #2c3e50;
            font-weight: bold;
            z-index: 10;
            animation: pulse 3s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="spinning-ring"></div>
        <div class="inner-disc">
            <div class="character char-xu">徐</div>
            <div class="character char-ze">泽</div>
            <div class="character char-rui">睿</div>
            <div class="center-name">徐泽睿</div>
        </div>
    </div>
</body>
</html>
